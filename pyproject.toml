[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doctree"
version = "0.1.0"
description = "구글 드라이브 도서 PDF 목록 대장 생성 CLI"
readme = "README.md"
authors = [{ name = "flynn", email = "coralstay3595@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
doctree = "src.cli:main"

[tool.setuptools]
packages = ["src", "config"]
